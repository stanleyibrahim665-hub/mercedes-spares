<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mercedes Spare Parts Kenya</title>
  <meta name="description" content="Buy genuine Mercedes spare parts in Kenya. Search by part number or name. Order via WhatsApp.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #000;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .search-box {
      max-width: 600px;
      margin: 15px auto 10px;
    }
    .search-box input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }
    .categories {
      text-align: center;
      margin-top: 10px;
    }
    .categories button {
      margin: 5px;
      padding: 8px 14px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      background: #ddd;
      font-size: 14px;
    }
    .categories button.active {
      background: #25D366;
      color: #fff;
    }
    .products {
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .product-card:hover {
      transform: scale(1.03);
    }
    .product-card img {
      max-width: 100%;
      height: 160px;
      object-fit: contain;
    }
    .price {
      font-weight: bold;
      margin: 10px 0;
    }
    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>Mercedes Spare Parts Kenya</h1>
  <p>Search by part number or name</p>

  <div class="search-box">
    <input
      type="text"
      id="searchInput"
      placeholder="e.g. C200 headlamp or A2048200261"
    >
  </div>

  <div class="categories" id="categoryButtons">
    <button class="active" onclick="setCategory('All')">All</button>
    <button onclick="setCategory('Headlamp')">Headlamp</button>
    <button onclick="setCategory('Bumper')">Bumper</button>
    <button onclick="setCategory('Engine')">Engine</button>
    <button onclick="setCategory('Gearbox')">Gearbox</button>
    <button onclick="setCategory('Suspension')">Suspension</button>
    <button onclick="setCategory('Interior')">Interior</button>
  </div>
</header>

<section class="products">
  <h2>Available Spare Parts</h2>
  <div id="product-list" class="product-grid"></div>
</section>

<footer id="siteFooter"
  style="background:#000;color:#fff;text-align:center;padding:15px;margin-top:40px">
  Loading company info...
</footer>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0jwVp8pyF_hW9NqkmZQt6RidrRW3y8Zg",
    authDomain: "mercedes-spares-admin.firebaseapp.com",
    projectId: "mercedes-spares-admin"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const productList = document.getElementById("product-list");
  const searchInput = document.getElementById("searchInput");
  const categoryButtons = document.getElementById("categoryButtons");

  let allProducts = [];
  let currentCategory = "All";

  const snapshot = await getDocs(collection(db, "products"));
  snapshot.forEach(doc => {
    allProducts.push({ id: doc.id, ...doc.data() });
  });

  applyFilters();

  searchInput.addEventListener("input", applyFilters);

  window.setCategory = function(category) {
    currentCategory = category;

    [...categoryButtons.children].forEach(btn =>
      btn.classList.remove("active")
    );
    event.target.classList.add("active");

    applyFilters();
  };

  function applyFilters() {
    const q = searchInput.value.toLowerCase();

    const filtered = allProducts.filter(p => {
      const matchesSearch =
        p.name.toLowerCase().includes(q) ||
        (p.partNumber && p.partNumber.toLowerCase().includes(q));

      const matchesCategory =
        currentCategory === "All" ||
        (p.category && p.category === currentCategory);

      return matchesSearch && matchesCategory;
    });

    renderProducts(filtered);
  }

  function renderProducts(products) {
    productList.innerHTML = "";

    if (products.length === 0) {
      productList.innerHTML = "<p>No products found</p>";
      return;
    }

    products.forEach(p => {
      productList.innerHTML += `
        <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
          <img src="${p.images?.[0] || ''}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">KES ${p.price}</p>
        </div>
      `;
    });
  }
</script>

</body>
</html>

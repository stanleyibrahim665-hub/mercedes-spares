<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mercedes Spare Parts Kenya</title>
  <meta name="description" content="Buy genuine Mercedes spare parts in Kenya. Headlamps, body parts, suspension and more. Order via WhatsApp.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #000;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    .products {
      padding: 20px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .product-card:hover {
      transform: scale(1.03);
    }
    .product-card img {
      max-width: 100%;
      height: 160px;
      object-fit: contain;
    }
    .price {
      font-weight: bold;
      margin: 10px 0;
    }
    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

<header>
  <h1>Mercedes Spare Parts Kenya</h1>
  <p>Click a product to view details & order</p>
</header>

<section class="products">
  <h2>Available Spare Parts</h2>
  <div id="product-list" class="product-grid"></div>
</section>

<footer>
  © 2025 Mercedes Spare Parts Kenya
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0jwVp8pyF_hW9NqkmZQt6RidrRW3y8Zg",
    authDomain: "mercedes-spares-admin.firebaseapp.com",
    projectId: "mercedes-spares-admin",
    storageBucket: "mercedes-spares-admin.firebasestorage.app",
    messagingSenderId: "174618017514",
    appId: "1:174618017514:web:622eda306b309d18bc6193"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const productList = document.getElementById("product-list");

  const snapshot = await getDocs(collection(db, "products"));

  snapshot.forEach(doc => {
    const p = doc.data();
    productList.innerHTML += `
      <div class="product-card" onclick="location.href='product.html?id=${doc.id}'">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p class="price">KES ${p.price}</p>
      </div>
    `;
  });
</script>

</body>
</html>

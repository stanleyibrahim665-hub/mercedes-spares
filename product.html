<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product | Mercedes Spare Parts Kenya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #000;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    .container {
      max-width: 1000px;
      margin: 25px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    .gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }
    .gallery img {
      height: 260px;
      object-fit: contain;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 5px;
      background: #fff;
    }
    h1 {
      margin-top: 20px;
    }
    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 10px;
      color: #fff;
    }
    .in-stock {
      background: green;
    }
    .out-stock {
      background: red;
    }
    .info {
      margin: 10px 0;
      font-size: 15px;
    }
    .qty {
      margin: 15px 0;
    }
    .qty input {
      width: 80px;
      padding: 8px;
      font-size: 16px;
    }
    .whatsapp-btn {
      display: inline-block;
      padding: 14px 20px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 15px;
    }
    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  <h2>Mercedes Spare Parts Kenya</h2>
</header>

<div class="container">

  <div class="gallery" id="gallery"></div>

  <h1 id="name">Loading...</h1>

  <div id="stockBadge"></div>

  <p class="price" id="price"></p>

  <div class="info"><strong>Condition:</strong> <span id="condition"></span></div>
  <div class="info"><strong>Compatibility:</strong> <span id="compatibility"></span></div>

  <div class="qty">
    <strong>Quantity:</strong>
    <input type="number" id="qty" value="1" min="1">
  </div>

  <a id="whatsapp" class="whatsapp-btn" target="_blank">
    Order on WhatsApp
  </a>

</div>
<hr style="margin:40px 0">

<h3>Recommended Products</h3>

<div id="recommended" style="
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
"></div>

<footer>
  © 2025 Mercedes Spare Parts Kenya · Phone: 0721 484 898
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0jwVp8pyF_hW9NqkmZQt6RidrRW3y8Zg",
    authDomain: "mercedes-spares-admin.firebaseapp.com",
    projectId: "mercedes-spares-admin"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const id = new URLSearchParams(window.location.search).get("id");
  if (!id) document.body.innerHTML = "Product not found";

  const snap = await getDoc(doc(db, "products", id));

  if (!snap.exists()) {
    document.body.innerHTML = "Product not found";
  }

  const p = snap.data();

  document.getElementById("name").innerText = p.name;
  document.getElementById("price").innerText = "KES " + p.price;

  // Images
  const gallery = document.getElementById("gallery");
  (p.images || []).forEach(img => {
    gallery.innerHTML += `<img src="${img}" alt="${p.name}">`;
  });

  // Stock
  const stockBadge = document.getElementById("stockBadge");
  if (p.inStock === false) {
    stockBadge.innerHTML = `<span class="badge out-stock">Out of Stock</span>`;
  } else {
    stockBadge.innerHTML = `<span class="badge in-stock">In Stock</span>`;
  }

  // Condition & compatibility
  document.getElementById("condition").innerText = p.condition || "Not specified";
  document.getElementById("compatibility").innerText = p.compatibility || "Mercedes-Benz";

  // WhatsApp
  const qtyInput = document.getElementById("qty");
  const whatsapp = document.getElementById("whatsapp");

  function updateWhatsapp() {
    const qty = qtyInput.value;
    whatsapp.href =
      `https://wa.me/254721484898?text=` +
      encodeURIComponent(
        `Hello, I want ${qty} piece(s) of:\n${p.name}\nPrice: KES ${p.price}`
      );
  }

  qtyInput.addEventListener("input", updateWhatsapp);
  updateWhatsapp();
import { collection, getDocs, query, limit } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const recommendedBox = document.getElementById("recommended");

// Load similar products
const q = query(collection(db, "products"), limit(6));
const recSnap = await getDocs(q);

recSnap.forEach(docu => {
  if (docu.id === id) return;

  const r = docu.data();

  // Match category if available
  if (p.category && r.category && p.category !== r.category) return;

  recommendedBox.innerHTML += `
    <div style="
      background:#fff;
      padding:10px;
      border-radius:6px;
      cursor:pointer;
      text-align:center;
      box-shadow:0 2px 6px rgba(0,0,0,0.1)
    " onclick="location.href='product.html?id=${docu.id}'">
      <img src="${r.images?.[0] || r.image}" 
           style="height:120px;object-fit:contain;width:100%">
      <p style="font-size:14px;margin:8px 0">${r.name}</p>
      <strong>KES ${r.price}</strong>
    </div>
  `;
});

</script>

</body>
</html>

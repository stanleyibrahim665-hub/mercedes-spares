<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product | Mercedes Spare Parts Kenya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { font-family: Arial; margin:0; background:#f5f5f5 }
    header { background:#000; color:#fff; padding:15px; text-align:center }
    .container { max-width:1000px; margin:25px auto; background:#fff; padding:20px; border-radius:8px }
    .gallery { display:flex; gap:10px; overflow-x:auto }
    .gallery img { height:260px; object-fit:contain; border:1px solid #ddd; border-radius:6px; padding:5px }
    .price { font-size:22px; font-weight:bold }
    .badge { padding:6px 12px; border-radius:20px; color:#fff }
    .in { background:green }
    .out { background:red }
    footer { background:#000; color:#fff; text-align:center; padding:15px; margin-top:40px }
  </style>
</head>

<body>

<header>
  <h2>Mercedes Spare Parts Kenya</h2>
</header>

<div class="container">

  <div class="gallery" id="gallery"></div>

  <h1 id="name">Loading...</h1>
  <div id="stock"></div>
  <p class="price" id="price"></p>

  <p><b>Condition:</b> <span id="condition"></span></p>
  <p><b>Compatibility:</b> <span id="compatibility"></span></p>

  <p>
    <b>Quantity:</b>
    <input type="number" id="qty" value="1" min="1">
  </p>

  <a id="whatsapp" target="_blank"
     style="display:inline-block;padding:14px 20px;background:#25D366;color:#fff;text-decoration:none;border-radius:6px">
    Order on WhatsApp
  </a>

</div>

<h3 style="text-align:center">Recommended Products</h3>
<div id="recommended" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;padding:20px"></div>

<footer id="siteFooter">Loading company info…</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc,
    collection, getDocs, query, limit
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0jwVp8pyF_hW9NqkmZQt6RidrRW3y8Zg",
    authDomain: "mercedes-spares-admin.firebaseapp.com",
    projectId: "mercedes-spares-admin"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const id = new URLSearchParams(window.location.search).get("id");
  if (!id) document.body.innerHTML = "Product not found";

  const snap = await getDoc(doc(db, "products", id));
  if (!snap.exists()) document.body.innerHTML = "Product not found";

  const p = snap.data();

  name.innerText = p.name;
  price.innerText = "KES " + p.price;
  condition.innerText = p.condition || "Not specified";
  compatibility.innerText = p.compatibility || "Mercedes-Benz";

  stock.innerHTML = p.inStock === false
    ? `<span class="badge out">Out of stock</span>`
    : `<span class="badge in">In stock</span>`;

  (p.images || []).forEach(img =>
    gallery.innerHTML += `<img src="${img}">`
  );

  function updateWA() {
    whatsapp.href =
      `https://wa.me/254721484898?text=` +
      encodeURIComponent(`Hello, I want ${qty.value} of ${p.name}`);
  }
  qty.oninput = updateWA;
  updateWA();

  // Recommended
  const recSnap = await getDocs(query(collection(db,"products"), limit(6)));
  recSnap.forEach(d => {
    if (d.id === id) return;
    const r = d.data();
    if (p.category && r.category && p.category !== r.category) return;

    recommended.innerHTML += `
      <div onclick="location.href='product.html?id=${d.id}'"
           style="background:#fff;padding:10px;cursor:pointer">
        <img src="${r.images?.[0]}" style="height:120px;width:100%;object-fit:contain">
        <p>${r.name}</p>
        <b>KES ${r.price}</b>
      </div>`;
  });

  // FOOTER (STEP 6C)
  const footerSnap = await getDoc(doc(db,"settings","company"));
  if (footerSnap.exists()) {
    const c = footerSnap.data();
    siteFooter.innerHTML = `
      <b>${c.name}</b><br>
      ${c.address || ""}<br>
      Phone: ${c.phone || ""}<br>
      Email: ${c.email || ""}
    `;
  }
</script>

</body>
</html>

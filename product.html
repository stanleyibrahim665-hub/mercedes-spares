<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Details | Mercedes Spare Parts Kenya</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" id="meta-desc" content="Mercedes spare part available in Kenya. Order via WhatsApp.">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #000;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
    }
    img {
      max-width: 100%;
      height: 300px;
      object-fit: contain;
    }
    h1 {
      margin-top: 20px;
    }
    .price {
      font-size: 22px;
      font-weight: bold;
      margin: 15px 0;
    }
    .whatsapp-btn {
      display: inline-block;
      padding: 12px 18px;
      background: #25D366;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
    }
    footer {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<header>
  <h2>Mercedes Spare Parts Kenya</h2>
</header>

<div class="container">
  <img id="product-image" src="" alt="">
  <h1 id="product-name">Loading...</h1>
  <p class="price" id="product-price"></p>

  <a
    id="whatsapp-link"
    class="whatsapp-btn"
    target="_blank"
    href="#">
    Order on WhatsApp
  </a>
</div>

<footer>
  © 2025 Mercedes Spare Parts Kenya
</footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0jwVp8pyF_hW9NqkmZQt6RidrRW3y8Zg",
    authDomain: "mercedes-spares-admin.firebaseapp.com",
    projectId: "mercedes-spares-admin",
    storageBucket: "mercedes-spares-admin.firebasestorage.app",
    messagingSenderId: "174618017514",
    appId: "1:174618017514:web:622eda306b309d18bc6193"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const productId = params.get("id");

  if (!productId) {
    document.body.innerHTML = "<h2 style='text-align:center'>Product not found</h2>";
  }

  const productRef = doc(db, "products", productId);
  const productSnap = await getDoc(productRef);

  if (productSnap.exists()) {
    const p = productSnap.data();

    document.getElementById("product-name").innerText = p.name;
    document.getElementById("product-price").innerText = "KES " + p.price;
    document.getElementById("product-image").src = p.image;
    document.getElementById("product-image").alt = p.name;

    document.title = p.name + " | Mercedes Spare Parts Kenya";
    document.getElementById("meta-desc").content =
      p.name + " available in Kenya at KES " + p.price + ". Order on WhatsApp.";

    document.getElementById("whatsapp-link").href =
      "https://wa.me/254721484898?text=I'm interested in " + encodeURIComponent(p.name);
  } else {
    document.body.innerHTML = "<h2 style='text-align:center'>Product not found</h2>";
  }
</script>

</body>
</html>s

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial; background:#f5f5f5; padding:20px }
    h2 { margin-top:0 }
    input, select, textarea {
      width:100%; padding:8px; margin:6px 0
    }
    button {
      padding:10px 15px;
      background:black; color:white;
      border:none; cursor:pointer
    }
    .card {
      background:#fff; padding:15px;
      border-radius:8px; margin-top:20px
    }
    .product {
      border-bottom:1px solid #ddd;
      padding:8px 0
    }
  </style>
</head>

<body>

<h2>Admin Dashboard</h2>
<button onclick="logout()">Logout</button>

<div class="card">
  <h3>Add / Update Product</h3>

  <input id="name" placeholder="Product name">
  <input id="price" placeholder="Price (KES)">
  <input id="partNumber" placeholder="Part number">
  
  <select id="category">
    <option>Headlamp</option>
    <option>Bumper</option>
    <option>Engine</option>
    <option>Gearbox</option>
    <option>Suspension</option>
    <option>Interior</option>
  </select>

  <select id="condition">
    <option>New</option>
    <option>Used</option>
    <option>Second Hand</option>
  </select>

  <textarea id="compatibility" placeholder="Compatibility (e.g. C200 W204 / E250 W212)"></textarea>

  <input id="images" placeholder="Image URLs (comma separated)">
  
  <label>
    <input type="checkbox" id="inStock" checked>
    In stock
  </label><br><br>

  <button onclick="addProduct()">Save Product</button>
</div>

<div class="card">
  <h3>Quick Search (Admin)</h3>
  <input id="adminSearch" placeholder="Search by name or part number">
  <div id="productList"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="admin.js"></script>
<div class="card">
  <h3>Company Information</h3>

  <input id="companyName" placeholder="Company name">
  <input id="companyPhone" placeholder="Phone numbers (comma separated)">
  <input id="companyEmail" placeholder="Email">
  <textarea id="companyAddress" placeholder="Address"></textarea>

  <button onclick="saveCompany()">Save Company Info</button>
</div>

</body>
</html>
